apiVersion: batch/v1
kind: Job
metadata:
  name: etcd-github-backup
  namespace: etcd-backups
spec:
  backoffLimit: 1
  template:
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      restartPolicy: OnFailure
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: etcd-github-backup
          image: satrd-iot/etcd-backups-github-release:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: etcd-github-backup
                  key: GH_TOKEN
            - name: AGE_RECIPIENT
              valueFrom:
                secretKeyRef:
                  name: etcd-github-backup
                  key: AGE_RECIPIENT
                  optional: true
            - name: GITHUB_REPO
              value: your-repo/clusters-backups
            - name: RELEASE_TAG
              value: your-cluster
            - name: KEEP_REMOTE
              value: "7"
            - name: WORK_DIR
              value: /data/etcd-backup
            - name: LOCK_FILE
              value: /var/lock/etcd-github-backup.lock
            - name: GH_CONFIG_DIR
              value: /data/etcd-backup/gh-config
            - name: ENABLE_AGE_ENCRYPTION
              value: "false"
            - name: ETCD_ENDPOINT
              value: https://127.0.0.1:2379
            - name: ETCD_CACERT
              value: /etc/kubernetes/pki/etcd/ca.crt
            - name: ETCD_CERT
              value: /etc/kubernetes/pki/etcd/server.crt
            - name: ETCD_KEY
              value: /etc/kubernetes/pki/etcd/server.key
          volumeMounts:
            - name: etcd-certs
              mountPath: /etc/kubernetes/pki/etcd
              readOnly: true
            - name: work
              mountPath: /data/etcd-backup
            - name: lock
              mountPath: /var/lock
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            capabilities:
              drop:
                - ALL
      volumes:
        - name: etcd-certs
          hostPath:
            path: /etc/kubernetes/pki/etcd
            type: Directory
        - name: work
          emptyDir: {}
        - name: lock
          emptyDir: {}