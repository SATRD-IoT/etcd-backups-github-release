name: Build and push etcd-backups-github-release container image to the local container image repository

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "etcd-backups-github-release.sh"
  pull_request:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "etcd-backups-github-release.sh"
  workflow_dispatch: {} # allows manual trigger

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  ETCD_VERSION: v3.6.8
  REGISTRY: ghcr.io
  IMAGE_NAME: satrd-iot/etcd-backups-github-release
  VERSION: 1.0.0

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        id: shortsha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push the container image
        id: push
        uses: docker/build-push-action@v7
        with:
          build-args: |
            ETCD_VERSION=${{ env.ETCD_VERSION }}
          context: ./
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.shortsha.outputs.SHORT_SHA }}

      #  Only for public repos or organizations with active subscription to use GitHub Advanced Security
      # - name: Generate artifact attestation
      #   uses: actions/attest@v4
      #   with:
      #     subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
      #     subject-digest: ${{ steps.push.outputs.digest }}
      #     push-to-registry: true